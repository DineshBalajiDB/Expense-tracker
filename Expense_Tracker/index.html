<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Daily Expense Tracker</h1>
        </header>

        <main>
            <section class="expense-form-section">
                <h2>Add New Expense</h2>
                <form id="expenseForm">
                    <div class="form-group">
                        <label for="amount">Amount ($)</label>
                        <input type="number" id="amount" step="0.01" min="0" required placeholder="0.00">
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" required placeholder="Enter expense description">
                    </div>
                    
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" required placeholder="e.g., Food, Transport, Shopping">
                    </div>
                    
                    <button type="submit" class="btn-primary">Add Expense</button>
                </form>
            </section>

            <section class="expenses-section">
                <div class="total-display">
                    <h2>Total Expenses</h2>
                    <p class="total-amount" id="totalAmount">$0.00</p>
                </div>

                <div class="expenses-list-container">
                    <h2>Expense History</h2>
                    <div id="expensesList" class="expenses-list">
                        <p class="empty-message">No expenses yet. Add your first expense above!</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
