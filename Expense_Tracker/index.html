<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income & Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Income & Expense Tracker</h1>
            <p class="subtitle">Track your finances in INR</p>
        </header>

        <div class="summary-cards">
            <div class="card balance-card">
                <h3>Balance</h3>
                <p class="amount" id="balance">₹0.00</p>
            </div>
            <div class="card income-card">
                <h3>Total Income</h3>
                <p class="amount" id="totalIncome">₹0.00</p>
            </div>
            <div class="card expense-card">
                <h3>Total Expenses</h3>
                <p class="amount" id="totalExpense">₹0.00</p>
            </div>
        </div>

        <div class="form-section">
            <h2>Add Transaction</h2>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <input type="text" id="description" placeholder="Add a note...">
                </div>
                <button type="submit" class="btn-primary">Add Transaction</button>
            </form>
        </div>

        <div class="transactions-section">
            <h2>Transaction History</h2>
            <div class="filter-section">
                <select id="filterType">
                    <option value="all">All Transactions</option>
                    <option value="income">Income Only</option>
                    <option value="expense">Expense Only</option>
                </select>
                <select id="filterCategory">
                    <option value="all">All Categories</option>
                </select>
                <button class="btn-download" onclick="generatePDF()">📄 Download PDF</button>
            </div>
            <div class="transactions-list" id="transactionsList">
                <p class="empty-state">No transactions yet. Add your first transaction above!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
