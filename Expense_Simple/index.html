<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income & Expense Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            font-size: 1rem;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card .amount {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
        }

        .balance-card .amount {
            color: #667eea;
        }

        .income-card .amount {
            color: #10b981;
        }

        .expense-card .amount {
            color: #ef4444;
        }

        .form-section,
        .transactions-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .form-section h2,
        .transactions-section h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.5rem;
        }

        #transactionForm {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group:last-of-type {
            grid-column: 1 / -1;
        }

        .btn-primary {
            grid-column: 1 / -1;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-section select {
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.9rem;
            background: white;
            cursor: pointer;
            flex: 1;
            min-width: 150px;
        }

        .btn-download {
            padding: 10px 20px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }

        .btn-download:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        .transactions-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .transaction-item {
            background: #f9fafb;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid;
            transition: background 0.2s ease;
        }

        .transaction-item:hover {
            background: #f3f4f6;
        }

        .transaction-item.income {
            border-left-color: #10b981;
        }

        .transaction-item.expense {
            border-left-color: #ef4444;
        }

        .transaction-details {
            flex: 1;
        }

        .transaction-date {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .transaction-category {
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
            text-transform: capitalize;
        }

        .transaction-description {
            font-size: 0.9rem;
            color: #6b7280;
            font-style: italic;
        }

        .transaction-amount {
            font-size: 1.3rem;
            font-weight: bold;
            margin-left: 20px;
        }

        .transaction-item.income .transaction-amount {
            color: #10b981;
        }

        .transaction-item.expense .transaction-amount {
            color: #ef4444;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 15px;
            transition: background 0.2s ease;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            color: #9ca3af;
            padding: 40px;
            font-size: 1.1rem;
        }

        /* Scrollbar styling */
        .transactions-list::-webkit-scrollbar {
            width: 8px;
        }

        .transactions-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .transactions-list::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .transactions-list::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .summary-cards {
                grid-template-columns: 1fr;
            }

            #transactionForm {
                grid-template-columns: 1fr;
            }

            .form-group:last-of-type {
                grid-column: 1;
            }

            .btn-primary {
                grid-column: 1;
            }

            .transaction-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .transaction-amount {
                margin-left: 0;
                margin-top: 10px;
            }

            .delete-btn {
                margin-left: 0;
                margin-top: 10px;
                width: 100%;
            }

            .btn-download {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Income & Expense Tracker</h1>
            <p class="subtitle">Track your finances in INR</p>
        </header>

        <div class="summary-cards">
            <div class="card balance-card">
                <h3>Balance</h3>
                <p class="amount" id="balance">₹0.00</p>
            </div>
            <div class="card income-card">
                <h3>Total Income</h3>
                <p class="amount" id="totalIncome">₹0.00</p>
            </div>
            <div class="card expense-card">
                <h3>Total Expenses</h3>
                <p class="amount" id="totalExpense">₹0.00</p>
            </div>
        </div>

        <div class="form-section">
            <h2>Add Transaction</h2>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <input type="text" id="description" placeholder="Add a note...">
                </div>
                <button type="submit" class="btn-primary">Add Transaction</button>
            </form>
        </div>

        <div class="transactions-section">
            <h2>Transaction History</h2>
            <div class="filter-section">
                <select id="filterType">
                    <option value="all">All Transactions</option>
                    <option value="income">Income Only</option>
                    <option value="expense">Expense Only</option>
                </select>
                <select id="filterCategory">
                    <option value="all">All Categories</option>
                </select>
                <button class="btn-download" onclick="generatePDF()">📄 Download PDF</button>
            </div>
            <div class="transactions-list" id="transactionsList">
                <p class="empty-state">No transactions yet. Add your first transaction above!</p>
            </div>
        </div>
    </div>

    <script>
        // Categories for income and expense
        const categories = {
            income: ['Salary', 'Freelance', 'Investment', 'Business', 'Gift', 'Other'],
            expense: ['Food', 'Transport', 'Shopping', 'Bills', 'Entertainment', 'Healthcare', 'Education', 'Other']
        };

        // Initialize transactions array
        let transactions = [];

        // Load transactions from localStorage
        function loadTransactions() {
            const stored = localStorage.getItem('transactions');
            if (stored) {
                transactions = JSON.parse(stored);
            }
        }

        // Save transactions to localStorage
        function saveTransactions() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        // Format amount in INR
        function formatINR(amount) {
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                minimumFractionDigits: 2
            }).format(amount);
        }

        // Update category dropdown based on type
        function updateCategoryDropdown() {
            const type = document.getElementById('type').value;
            const categorySelect = document.getElementById('category');
            categorySelect.innerHTML = '<option value="">Select Category</option>';
            
            categories[type].forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });
        }

        // Update filter category dropdown
        function updateFilterCategory() {
            const filterCategory = document.getElementById('filterCategory');
            const allCategories = [...new Set([...categories.income, ...categories.expense])];
            
            filterCategory.innerHTML = '<option value="all">All Categories</option>';
            allCategories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                filterCategory.appendChild(option);
            });
        }

        // Calculate totals
        function calculateTotals() {
            const totalIncome = transactions
                .filter(t => t.type === 'income')
                .reduce((sum, t) => sum + parseFloat(t.amount), 0);
            
            const totalExpense = transactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + parseFloat(t.amount), 0);
            
            const balance = totalIncome - totalExpense;
            
            document.getElementById('totalIncome').textContent = formatINR(totalIncome);
            document.getElementById('totalExpense').textContent = formatINR(totalExpense);
            document.getElementById('balance').textContent = formatINR(balance);
            
            // Update balance color based on positive/negative
            const balanceElement = document.getElementById('balance');
            if (balance >= 0) {
                balanceElement.style.color = '#10b981';
            } else {
                balanceElement.style.color = '#ef4444';
            }
        }

        // Display transactions
        function displayTransactions() {
            const transactionsList = document.getElementById('transactionsList');
            const filterType = document.getElementById('filterType').value;
            const filterCategory = document.getElementById('filterCategory').value;
            
            // Filter transactions
            let filteredTransactions = transactions;
            
            if (filterType !== 'all') {
                filteredTransactions = filteredTransactions.filter(t => t.type === filterType);
            }
            
            if (filterCategory !== 'all') {
                filteredTransactions = filteredTransactions.filter(t => t.category === filterCategory);
            }
            
            // Sort by date (newest first)
            filteredTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            if (filteredTransactions.length === 0) {
                transactionsList.innerHTML = '<p class="empty-state">No transactions found. Add your first transaction above!</p>';
                return;
            }
            
            transactionsList.innerHTML = filteredTransactions.map((transaction, index) => {
                const date = new Date(transaction.date);
                const formattedDate = date.toLocaleDateString('en-IN', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });
                
                return `
                    <div class="transaction-item ${transaction.type}">
                        <div class="transaction-details">
                            <div class="transaction-date">${formattedDate}</div>
                            <div class="transaction-category">${transaction.category}</div>
                            ${transaction.description ? `<div class="transaction-description">${transaction.description}</div>` : ''}
                        </div>
                        <div class="transaction-amount">${transaction.type === 'income' ? '+' : '-'}${formatINR(transaction.amount)}</div>
                        <button class="delete-btn" onclick="deleteTransaction(${transaction.id})">Delete</button>
                    </div>
                `;
            }).join('');
        }

        // Add transaction
        function addTransaction(event) {
            event.preventDefault();
            
            const date = document.getElementById('date').value;
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const description = document.getElementById('description').value;
            
            if (!date || !category || amount <= 0) {
                alert('Please fill in all required fields with valid values.');
                return;
            }
            
            const transaction = {
                id: Date.now(),
                date: date,
                type: type,
                category: category,
                amount: amount,
                description: description
            };
            
            transactions.push(transaction);
            saveTransactions();
            
            // Reset form
            document.getElementById('transactionForm').reset();
            updateCategoryDropdown();
            
            // Set today's date as default
            document.getElementById('date').valueAsDate = new Date();
            
            calculateTotals();
            displayTransactions();
        }

        // Delete transaction
        function deleteTransaction(id) {
            if (confirm('Are you sure you want to delete this transaction?')) {
                transactions = transactions.filter(t => t.id !== id);
                saveTransactions();
                calculateTotals();
                displayTransactions();
            }
        }

        // Generate PDF report
        function generatePDF() {
            if (transactions.length === 0) {
                alert('No transactions to export. Please add some transactions first.');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Calculate totals
            const totalIncome = transactions
                .filter(t => t.type === 'income')
                .reduce((sum, t) => sum + parseFloat(t.amount), 0);
            
            const totalExpense = transactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + parseFloat(t.amount), 0);
            
            const balance = totalIncome - totalExpense;
            
            // Set up colors
            const primaryColor = [102, 126, 234];
            const incomeColor = [16, 185, 129];
            const expenseColor = [239, 68, 68];
            const textColor = [51, 51, 51];
            const lightGray = [243, 244, 246];
            
            let yPos = 20;
            
            // Header
            doc.setFillColor(...primaryColor);
            doc.rect(0, 0, 210, 40, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(24);
            doc.setFont('helvetica', 'bold');
            doc.text('Income & Expense Tracker', 105, 20, { align: 'center' });
            doc.setFontSize(12);
            doc.setFont('helvetica', 'normal');
            doc.text('Financial Report', 105, 30, { align: 'center' });
            
            yPos = 50;
            
            // Summary Section
            doc.setTextColor(...textColor);
            doc.setFontSize(16);
            doc.setFont('helvetica', 'bold');
            doc.text('Summary', 14, yPos);
            yPos += 10;
            
            // Summary boxes
            const boxWidth = 58;
            const boxHeight = 30;
            const startX = 14;
            const spacing = 4;
            
            // Balance box
            doc.setFillColor(...primaryColor);
            doc.roundedRect(startX, yPos, boxWidth, boxHeight, 3, 3, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.text('BALANCE', startX + boxWidth/2, yPos + 8, { align: 'center' });
            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.text(formatINR(balance), startX + boxWidth/2, yPos + 20, { align: 'center' });
            
            // Income box
            doc.setFillColor(...incomeColor);
            doc.roundedRect(startX + boxWidth + spacing, yPos, boxWidth, boxHeight, 3, 3, 'F');
            doc.text('TOTAL INCOME', startX + boxWidth + spacing + boxWidth/2, yPos + 8, { align: 'center' });
            doc.setFontSize(14);
            doc.text(formatINR(totalIncome), startX + boxWidth + spacing + boxWidth/2, yPos + 20, { align: 'center' });
            
            // Expense box
            doc.setFillColor(...expenseColor);
            doc.roundedRect(startX + (boxWidth + spacing) * 2, yPos, boxWidth, boxHeight, 3, 3, 'F');
            doc.text('TOTAL EXPENSES', startX + (boxWidth + spacing) * 2 + boxWidth/2, yPos + 8, { align: 'center' });
            doc.setFontSize(14);
            doc.text(formatINR(totalExpense), startX + (boxWidth + spacing) * 2 + boxWidth/2, yPos + 20, { align: 'center' });
            
            yPos += boxHeight + 15;
            
            // Transactions Section
            doc.setTextColor(...textColor);
            doc.setFontSize(16);
            doc.setFont('helvetica', 'bold');
            doc.text('Transaction History', 14, yPos);
            yPos += 8;
            
            // Table header
            doc.setFillColor(...lightGray);
            doc.rect(14, yPos, 182, 8, 'F');
            doc.setTextColor(...textColor);
            doc.setFontSize(10);
            doc.setFont('helvetica', 'bold');
            doc.text('Date', 18, yPos + 6);
            doc.text('Type', 50, yPos + 6);
            doc.text('Category', 75, yPos + 6);
            doc.text('Description', 120, yPos + 6);
            doc.text('Amount', 180, yPos + 6, { align: 'right' });
            
            yPos += 12;
            
            // Sort transactions by date (oldest first for PDF)
            const sortedTransactions = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            // Transaction rows
            sortedTransactions.forEach((transaction, index) => {
                // Check if we need a new page
                if (yPos > 270) {
                    doc.addPage();
                    yPos = 20;
                    
                    // Redraw header on new page
                    doc.setFillColor(...primaryColor);
                    doc.rect(0, 0, 210, 30, 'F');
                    doc.setTextColor(255, 255, 255);
                    doc.setFontSize(16);
                    doc.setFont('helvetica', 'bold');
                    doc.text('Transaction History (continued)', 105, 20, { align: 'center' });
                    yPos = 35;
                    
                    // Redraw table header
                    doc.setFillColor(...lightGray);
                    doc.rect(14, yPos, 182, 8, 'F');
                    doc.setTextColor(...textColor);
                    doc.setFontSize(10);
                    doc.setFont('helvetica', 'bold');
                    doc.text('Date', 18, yPos + 6);
                    doc.text('Type', 50, yPos + 6);
                    doc.text('Category', 75, yPos + 6);
                    doc.text('Description', 120, yPos + 6);
                    doc.text('Amount', 180, yPos + 6, { align: 'right' });
                    yPos += 12;
                }
                
                // Alternate row colors
                if (index % 2 === 0) {
                    doc.setFillColor(255, 255, 255);
                } else {
                    doc.setFillColor(...lightGray);
                }
                doc.rect(14, yPos - 4, 182, 8, 'F');
                
                // Transaction data
                const date = new Date(transaction.date);
                const formattedDate = date.toLocaleDateString('en-IN', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });
                
                doc.setFontSize(9);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor(...textColor);
                doc.text(formattedDate, 18, yPos + 2);
                
                doc.setFont('helvetica', 'bold');
                doc.text(transaction.type.toUpperCase(), 50, yPos + 2);
                
                doc.setFont('helvetica', 'normal');
                doc.text(transaction.category, 75, yPos + 2);
                
                const description = transaction.description || '-';
                const maxDescWidth = 60;
                let descText = description;
                if (doc.getTextWidth(description) > maxDescWidth) {
                    descText = doc.splitTextToSize(description, maxDescWidth)[0] + '...';
                }
                doc.text(descText, 120, yPos + 2);
                
                // Amount with color
                const amountText = (transaction.type === 'income' ? '+' : '-') + formatINR(transaction.amount);
                if (transaction.type === 'income') {
                    doc.setTextColor(...incomeColor);
                } else {
                    doc.setTextColor(...expenseColor);
                }
                doc.text(amountText, 180, yPos + 2, { align: 'right' });
                
                yPos += 8;
            });
            
            // Footer
            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(128, 128, 128);
                doc.text(
                    `Page ${i} of ${pageCount}`,
                    105,
                    285,
                    { align: 'center' }
                );
                const currentDate = new Date().toLocaleDateString('en-IN', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });
                doc.text(
                    `Generated on ${currentDate}`,
                    105,
                    290,
                    { align: 'center' }
                );
            }
            
            // Generate filename
            const today = new Date();
            const filename = `expense-report-${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}.pdf`;
            
            // Save PDF
            doc.save(filename);
        }

        // Initialize app
        function init() {
            // Set today's date as default
            document.getElementById('date').valueAsDate = new Date();
            
            // Update category dropdown
            updateCategoryDropdown();
            updateFilterCategory();
            
            // Load transactions
            loadTransactions();
            
            // Calculate and display totals
            calculateTotals();
            
            // Display transactions
            displayTransactions();
            
            // Event listeners
            document.getElementById('transactionForm').addEventListener('submit', addTransaction);
            document.getElementById('type').addEventListener('change', updateCategoryDropdown);
            document.getElementById('filterType').addEventListener('change', displayTransactions);
            document.getElementById('filterCategory').addEventListener('change', displayTransactions);
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
